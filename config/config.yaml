# AutoTrader project defaults (non-secret). Risk limits are locked until a human changes them.
# Timezone for all engine decisions: UTC.

mode: paper

# App-facing symbols. Use Market Watch names as-is (e.g. Exness EURUSDm), or keep
# logical EURUSD/USDJPY and map them via symbol_map below.
symbols:
  - EURUSD
  - USDJPY

# Optional: logical name → broker wire name for MT5 copy_rates / symbol_select.
# Exness Standard often suffixes "m" (EURUSDm, USDJPYm). Leave empty if symbols
# already match Market Watch.
# symbol_map:
#   EURUSD: EURUSDm
#   USDJPY: USDJPYm
symbol_map: {}

timeframes:
  entry: H1
  trend: H4

# Active window for local pre-VPS runs (operator hours, London–NY overlap).
# Outside this window: no new entries (see autotrader.active_window.is_within_active_window).
# Inclusive start, exclusive end; weekdays only by default.
active_window:
  timezone: UTC
  weekdays_only: true
  start: "12:00"
  end: "21:00"

risk:
  max_risk_per_trade_pct: 0.5
  max_daily_loss_pct: 2.0
  max_weekly_drawdown_pct: 5.0
  max_open_positions: 2

# Backtest cost simulation (price units; override via CLI flags).
backtest:
  spread: 0.00012
  slippage: 0.00005
  fee_per_trade: 0.0
  starting_equity: 10000.0

news:
  # ± minutes around High-impact USD/EUR/JPY events (Agent 2)
  blackout_minutes: 30
  high_impact_currencies:
    - USD
    - EUR
    - JPY

# LLMClient (M5). Default backend=mock so CI needs no API keys.
# Keys / LLM_BASE_URL stay in local `.env` only.
# Real LLM: set backend=http (or env LLM_BACKEND=http) + API key; replace model
# ids below (examples: gpt-4o-mini / gpt-4o, or deepseek-chat). Keep MODE=paper.
llm:
  backend: mock  # mock | http
  timeout_seconds: 30
  models:
    technical: mock-cheap       # Agent 1 — cheap slot
    news: mock-cheap            # Agent 2 — cheap slot
    risk_manager: mock-mid      # Agent 3 — mid slot
    decision_maker: mock-strong # Agent 4 — stronger slot

# M8 paper A/B harness (synthetic/mock cycles — not a multi-week live paper run).
# ab_mode: rules_only | rules_plus_ai | both
# Gate pass does NOT enable MODE=live.
paper_ab:
  ab_mode: both
  cycles: 50
  seed: 42
  starting_equity: 10000.0
  signal_rate: 0.55
  bad_json_rate: 0.02
  ai_skip_rate: 0.15
  positive_bias: 0.55
  gates:
    min_closed_trades: 80
    max_calendar_weeks: 12
    max_drawdown_pct: 8.0
    min_net_return_pct: 0.0
    min_expectancy_r: 0.0
    min_reward_risk: 1.0
    max_bad_json_rate_pct: 3.0
    ab_dd_tolerance_pp: 1.0

logging:
  level: INFO
  utc: true

# SQLite trade journal (WAL). Override with DATABASE_URL in local `.env`.
# Default file path (when DATABASE_URL unset): data/autotrader.db under repo root.
database:
  url: ""
