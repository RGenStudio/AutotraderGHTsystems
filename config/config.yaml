# AutoTrader project defaults (non-secret). Risk limits are locked until a human changes them.
# Timezone for all engine decisions: UTC.

mode: paper

# App-facing symbols. Use Market Watch names with exact broker casing
# (Exness EURUSDm ≠ EURUSDM), or keep logical EURUSD/USDJPY + symbol_map.
symbols:
  - EURUSD
  - USDJPY

# Optional: logical name → broker wire name for MT5 copy_rates / symbol_select.
# Exness Standard often suffixes "m" (EURUSDm, USDJPYm). Values keep casing;
# leave empty if symbols already match Market Watch exactly.
# symbol_map:
#   EURUSD: EURUSDm
#   USDJPY: USDJPYm
symbol_map: {}

timeframes:
  entry: H1
  trend: H4

# Active window — effectively 24h when the engine is up.
# start 00:00 / end 24:00 (end-of-day sentinel) + weekdays_only=false → all UTC hours every day.
# New entries may run whenever the engine process is running; kill switch / risk rules unchanged.
# Narrow the window again here if you want operator-hours only.
active_window:
  timezone: UTC
  weekdays_only: false
  start: "00:00"
  end: "24:00"

risk:
  max_risk_per_trade_pct: 0.5
  max_daily_loss_pct: 2.0
  max_weekly_drawdown_pct: 5.0
  max_open_positions: 2

# Backtest cost simulation (price units; override via CLI flags).
backtest:
  spread: 0.00012
  slippage: 0.00005
  fee_per_trade: 0.0
  starting_equity: 10000.0

news:
  # ± minutes around High-impact USD/EUR/JPY events (Agent 2)
  blackout_minutes: 30
  high_impact_currencies:
    - USD
    - EUR
    - JPY

# LLMClient. Default backend=http with real model ids (Bartender: don't over-save on 3+4).
# CI / no keys: create_llm_client soft-falls to mock. Force mock with LLM_BACKEND=mock.
# Keys / LLM_BASE_URL stay in local `.env` only. Keep MODE=paper.
# You may set all four models to gpt-4o if preferred (see ops doc).
llm:
  backend: http
  timeout_seconds: 30
  models:
    technical: gpt-4o-mini      # Agent1 filter — cheaper-capable
    news: gpt-4o-mini           # Agent2
    risk_manager: gpt-4o        # Agent3
    decision_maker: gpt-4o      # Agent4 final

# Best-effort API credit / balance alert → Telegram (orchestrator heartbeat / --loop).
# Threshold also overridable via env API_CREDIT_WARN_USD. Optional manual OPENAI_CREDIT_USD.
api_credit:
  warn_usd: 1.0
  cooldown_hours: 6

# M8 paper A/B harness (synthetic/mock cycles — not a multi-week live paper run).
# ab_mode: rules_only | rules_plus_ai | both
# Gate pass does NOT enable MODE=live.
# Sample size: min_closed_trades OR min_weeks (whichever comes first).
# min_weeks=2 is weaker statistically than 12 — Bartender accepted.
paper_ab:
  ab_mode: both
  cycles: 50
  seed: 42
  starting_equity: 10000.0
  signal_rate: 0.55
  bad_json_rate: 0.02
  ai_skip_rate: 0.15
  positive_bias: 0.55
  gates:
    min_closed_trades: 80
    min_weeks: 2
    max_drawdown_pct: 8.0
    min_net_return_pct: 0.0
    min_expectancy_r: 0.0
    min_reward_risk: 1.0
    max_bad_json_rate_pct: 3.0
    ab_dd_tolerance_pp: 1.0

logging:
  level: INFO
  utc: true

# SQLite trade journal (WAL). Override with DATABASE_URL in local `.env`.
# Default file path (when DATABASE_URL unset): data/autotrader.db under repo root.
database:
  url: ""
